<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Entropy for Life contribution overview</title>
  <desc id="desc">Overview of Mario Marcolongo's paid Entropy for Life work: at least 59 published projects, including more than 55 YouTube video projects and four co-authored articles. Fact-checking is recurring, while research, script development, visualization, slides, thumbnails and website operations vary by output.</desc>
  <rect width="1200" height="760" fill="#f3efe6"/>
  <rect x="34" y="34" width="1132" height="692" rx="24" fill="#fffdf8" stroke="#d8d0c3" stroke-width="2"/>

  <text x="78" y="94" fill="#c34b36" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">PAID SCIENTIFIC VERIFICATION · ENTROPY FOR LIFE</text>
  <text x="78" y="151" fill="#171713" font-family="Georgia, 'Times New Roman', serif" font-size="46">59+ published projects, with roles attributed per output.</text>
  <text x="78" y="190" fill="#62635e" font-family="Arial, Helvetica, sans-serif" font-size="19">The portfolio separates the main body of video work from the smaller article record.</text>

  <g transform="translate(78 232)">
    <rect width="666" height="214" rx="18" fill="#151513"/>
    <text x="30" y="42" fill="#ff816b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.4">PUBLISHED VIDEO PROJECTS</text>
    <text x="30" y="132" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="84">55+</text>
    <text x="225" y="100" fill="#f4efe7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">YouTube videos and documentaries</text>
    <text x="225" y="133" fill="#bcb9b2" font-family="Arial, Helvetica, sans-serif" font-size="17">indexed through the contribution playlist</text>
    <line x1="30" y1="160" x2="636" y2="160" stroke="#45443f"/>
    <text x="30" y="194" fill="#d7d3cb" font-family="Arial, Helvetica, sans-serif" font-size="16">Most combine literature research, fact-checking and script development.</text>
  </g>

  <g transform="translate(766 232)">
    <rect width="356" height="214" rx="18" fill="#f6e4df" stroke="#e5b7ad"/>
    <text x="26" y="42" fill="#a13c2c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.4">CO-AUTHORED ARTICLES</text>
    <text x="26" y="132" fill="#171713" font-family="Georgia, 'Times New Roman', serif" font-size="84">4</text>
    <text x="122" y="101" fill="#3e3d39" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">scientific articles</text>
    <text x="122" y="130" fill="#66615c" font-family="Arial, Helvetica, sans-serif" font-size="16">writing, evidence review</text>
    <text x="122" y="154" fill="#66615c" font-family="Arial, Helvetica, sans-serif" font-size="16">and selected visualization</text>
  </g>

  <text x="78" y="497" fill="#7a736b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">CONTRIBUTION MIX · DEPENDING ON THE PRODUCTION</text>
  <g transform="translate(78 520)" font-family="Arial, Helvetica, sans-serif">
    <g><rect width="246" height="70" rx="14" fill="#eee9df"/><text x="20" y="29" fill="#a13c2c" font-size="14" font-weight="700">RECURRING</text><text x="20" y="54" fill="#252520" font-size="19" font-weight="700">Scientific fact-checking</text></g>
    <g transform="translate(262 0)"><rect width="246" height="70" rx="14" fill="#eee9df"/><text x="20" y="29" fill="#77716a" font-size="14" font-weight="700">CORE</text><text x="20" y="54" fill="#252520" font-size="19" font-weight="700">Literature research</text></g>
    <g transform="translate(524 0)"><rect width="246" height="70" rx="14" fill="#eee9df"/><text x="20" y="29" fill="#77716a" font-size="14" font-weight="700">FREQUENT</text><text x="20" y="54" fill="#252520" font-size="19" font-weight="700">Script development</text></g>
    <g transform="translate(786 0)"><rect width="258" height="70" rx="14" fill="#eee9df"/><text x="20" y="29" fill="#77716a" font-size="14" font-weight="700">SELECTED OUTPUTS</text><text x="20" y="54" fill="#252520" font-size="19" font-weight="700">Data visualization</text></g>
  </g>

  <g transform="translate(78 606)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1044" height="68" rx="14" fill="#f8f4ec" stroke="#ded6c9"/>
    <text x="20" y="28" fill="#4b4944" font-size="16" font-weight="700">Additional documented work</text>
    <text x="20" y="52" fill="#6a6660" font-size="15">Presentation slides · on-screen assets · selected thumbnails · short-form materials · hosting, WordPress, DNS/SSL and technical SEO</text>
  </g>

  <text x="78" y="704" fill="#77716a" font-family="Arial, Helvetica, sans-serif" font-size="14">Additional Instagram and TikTok contributions are not yet fully indexed and are excluded from the 59+ total.</text>
