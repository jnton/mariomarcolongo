  <text x="76" y="575" fill="#ff8b73" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">RECURRING RESPONSIBILITIES</text>
  <text x="76" y="620" fill="#fffaf1" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="650">Primary-literature research · scientific fact-checking</text>

  <text x="76" y="672" fill="#ff8b73" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">DEPENDING ON THE PROJECT</text>
  <text x="76" y="710" fill="#c9ccc4" font-family="Inter, Arial, sans-serif" font-size="22">Script development · data visualization · slides/on-screen assets · selected thumbnails</text>
