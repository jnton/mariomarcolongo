<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Entropy for Life documented work inventory</title>
  <desc id="desc">59 plus documented published projects: 55 plus YouTube video projects and four co-authored articles, with recurring literature research and scientific fact-checking plus project-specific scripts, visualizations, slides and thumbnails.</desc>
