      <stop offset="1" stop-color="#20231e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff765d"/>
      <stop offset="1" stop-color="#ffb36d"/>
