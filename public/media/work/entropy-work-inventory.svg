  <text x="246" y="392" fill="#fffaf1" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="750">YouTube video projects</text>
  <text x="246" y="432" fill="#aeb2aa" font-family="Inter, Arial, sans-serif" font-size="21">contribution playlist</text>

  <rect x="596" y="334" width="532" height="146" rx="18" fill="#292c27" stroke="#50544c"/>
  <text x="628" y="401" fill="#fffaf1" font-family="Georgia, Times New Roman, serif" font-size="66">4</text>
