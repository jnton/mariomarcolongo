  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="692" rx="18" fill="none" stroke="#4a4d46" stroke-width="2"/>
  <rect x="34" y="34" width="1132" height="10" rx="5" fill="url(#accent)"/>

  <text x="76" y="104" fill="#ff8b73" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="3">ENTROPY FOR LIFE · DOCUMENTED PUBLISHED WORK</text>

  <text x="74" y="276" fill="#fffaf1" font-family="Georgia, Times New Roman, serif" font-size="176" font-weight="500">59+</text>
  <text x="470" y="211" fill="#fffaf1" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="750">published projects</text>
  <text x="470" y="266" fill="#aeb2aa" font-family="Inter, Arial, sans-serif" font-size="26">documented through direct public evidence</text>

  <rect x="72" y="334" width="500" height="146" rx="18" fill="#292c27" stroke="#50544c"/>
