name: Visual audit portfolio

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/capture-homepage-v4.js
      - src/pages/index.astro
      - src/pages/evidence/**
      - src/styles/portfolio-v8.css
      - src/styles/portfolio-v9-overrides.css
      - src/styles/nav-editorial.css
      - data/portfolio-human.js
      - public/media/work/**
      - .github/workflows/visual-audit-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: human-centered-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Use the legible dated Gray Swan metric crop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          portfolio = Path('data/portfolio-human.js')
          text = portfolio.read_text()
          text = text.replace('/media/work/model-behavior-profile.jpg', '/media/work/gray-swan-profile-2026-07-24.svg')
          portfolio.write_text(text)

          checks = Path('scripts/check-stale-strings.js')
          text = checks.read_text()
          text = text.replace(
              "'public/media/work/model-behavior-profile.jpg', 'public/media/work/yourself-to-science-800.webp',",
              "'public/media/work/model-behavior-profile.jpg', 'public/media/work/gray-swan-profile-2026-07-24.svg', 'public/media/work/yourself-to-science-800.webp',"
          )
          text = text.replace("'/media/work/model-behavior-profile.jpg', 'https://entropyforlife.it", "'/media/work/gray-swan-profile-2026-07-24.svg', 'https://entropyforlife.it")
          checks.write_text(text)

          css = Path('src/styles/portfolio-v9-overrides.css')
          text = css.read_text().replace('aspect-ratio: 1400 / 929;', 'aspect-ratio: 2 / 1;')
          css.write_text(text)
          PY
      - name: Build and retain diagnostics
        shell: bash
        run: |
          mkdir -p audit-v4
          set -o pipefail
          npm run build 2>&1 | tee audit-v4/build.log
      - name: Capture scrolled homepage states
        run: node scripts/capture-homepage-v4.js
      - name: Commit source and deterministic generated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/portfolio-human.js scripts/check-stale-strings.js src/styles/portfolio-v9-overrides.css \
            index.html integrity.html security.html cv.html \
            cv-resume.html cv-research.html cv-editorial.html cv-integrity.html \
            llms.txt llms-full.txt cv-llm.txt \
            public/llms.txt public/llms-full.txt public/cv-llm.txt public/data/source.js
          git commit -m "fix: show the dated Gray Swan rank and percentile crop"
          git push origin HEAD:human-centered-redesign
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-audit
          path: audit-v4/**/*
          if-no-files-found: error
          retention-days: 7
