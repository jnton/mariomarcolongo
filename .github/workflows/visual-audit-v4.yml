name: Visual audit portfolio

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/capture-homepage-v4.js
      - src/pages/index.astro
      - src/pages/evidence/**
      - src/styles/portfolio-v8.css
      - src/styles/portfolio-v9-overrides.css
      - src/styles/nav-editorial.css
      - data/portfolio-human.js
      - public/media/work/**
      - .github/workflows/visual-audit-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: human-centered-redesign
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and retain diagnostics
        shell: bash
        run: |
          mkdir -p audit-v4
          set -o pipefail
          npm run build 2>&1 | tee audit-v4/build.log
      - name: Capture scrolled homepage states
        run: node scripts/capture-homepage-v4.js
      - name: Commit deterministic output and restore the audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/visual-audit-v4.yml > .github/workflows/visual-audit-v4.yml
          git rm -f .github/workflows/regenerate-homepage-output.yml
          git add \
            .github/workflows/visual-audit-v4.yml \
            index.html integrity.html security.html cv.html \
            cv-resume.html cv-research.html cv-editorial.html cv-integrity.html \
            llms.txt llms-full.txt cv-llm.txt \
            public/llms.txt public/llms-full.txt public/cv-llm.txt public/data/source.js
          git commit -m "build: refresh contribution archives and homepage output"
          git push origin HEAD:human-centered-redesign
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-audit
          path: audit-v4/**/*
          if-no-files-found: error
          retention-days: 7
