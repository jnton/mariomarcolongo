name: Finalize homepage performance
# Triggered after the workflow became available on the release branch.

on:
  push:
    branches:
      - release/application-ready-2026-07-25
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/application-ready-2026-07-25
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prioritize visible hero media
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/index.astro')
          text = path.read_text()
          old = '''                loading={index === 0 ? "eager" : "lazy"}
                decoding="async"'''
          new = '''                loading={index < 2 ? "eager" : "lazy"}
                fetchpriority={index < 2 ? "high" : "auto"}
                decoding="async"'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one hero-image loading block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install and verify production build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit the focused performance fix
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-homepage-performance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: prioritize visible hero media"
          git push origin HEAD:release/application-ready-2026-07-25
