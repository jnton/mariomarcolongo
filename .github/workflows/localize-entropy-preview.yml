name: Localize Entropy preview

on:
  push:
    branches:
      - release/application-ready-2026-07-25
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/application-ready-2026-07-25
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preserve the published Entropy visualization locally
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output public/media/work/entropy-dashboard-800.webp \
            https://entropyforlife.it/wp-content/uploads/2024/10/Dashboard-1-5-png.webp
          test -s public/media/work/entropy-dashboard-800.webp
          python - <<'PY'
          from pathlib import Path

          remote = 'https://entropyforlife.it/wp-content/uploads/2024/10/Dashboard-1-5-png.webp'
          local = '/media/work/entropy-dashboard-800.webp'

          portfolio = Path('data/portfolio-human.js')
          text = portfolio.read_text()
          count = text.count(remote)
          if count != 2:
              raise SystemExit(f'Expected two Entropy image references, found {count}')
          portfolio.write_text(text.replace(remote, local))

          source_checks = Path('scripts/check-stale-strings.js')
          text = source_checks.read_text()
          if remote not in text:
              raise SystemExit('Source integrity check did not contain the remote Entropy image')
          text = text.replace(remote, local)
          required_anchor = "'public/media/work/mdpi-filter-1-800.webp'"
          text = text.replace(required_anchor, "'public/media/work/entropy-dashboard-800.webp', " + required_anchor, 1)
          source_checks.write_text(text)

          generated_checks = Path('scripts/verify-dist.js')
          text = generated_checks.read_text()
          if remote not in text:
              raise SystemExit('Generated-output check did not contain the remote Entropy image')
          generated_checks.write_text(text.replace(remote, local))
          PY

      - name: Install and verify production build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit the localized evidence preview
        run: |
          set -euo pipefail
          rm -f .github/workflows/localize-entropy-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: serve the Entropy evidence preview locally"
          git push origin HEAD:release/application-ready-2026-07-25
