name: Deploy to Cloudflare Pages

# Production deployment for the application-ready portfolio.
# pull_request_target always checks out a trusted main-branch commit, never
# pull-request code. A deploy/production-* PR can therefore trigger a deliberate
# production refresh without exposing secrets to the pull-request branch.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.merged == true ||
      startsWith(github.event.pull_request.head.ref, 'deploy/production-')
    name: Build, deploy and verify production site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'pull_request_target' && (github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.base.sha) || github.sha }}

    steps:
      - name: Check out trusted production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application-ready portfolio
        run: npm run build

      - name: Verify rendered pages and interactions
        run: npm run verify:render

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mariomarcolongo-pages --branch=main --commit-hash=${{ env.DEPLOY_SHA }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the public release
        env:
          LIVE_RELEASE_ID: ${{ env.DEPLOY_SHA }}
          LIVE_VERIFY_ATTEMPTS: '18'
          LIVE_VERIFY_DELAY_MS: '10000'
        run: npm run verify:live
