name: Deploy to Cloudflare Pages

# Production deployment for the application-ready portfolio.
# pull_request_target checks out only the resulting main-branch merge commit,
# never untrusted pull-request code, so production secrets remain isolated.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    name: Build and deploy production site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Check out resulting production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application-ready portfolio
        run: npm run build

      - name: Verify rendered pages and interactions
        run: npm run verify:render

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mariomarcolongo-pages --branch=main --commit-hash=${{ github.event.pull_request.merge_commit_sha || github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
