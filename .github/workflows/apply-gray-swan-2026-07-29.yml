name: Apply Gray Swan 29 July snapshot

on:
  push:
    branches:
      - update/gray-swan-2026-07-29
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correct one-time migration template
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/migrate-gray-swan-2026-07-29.cjs')
          s = p.read_text()
          s = s.replace("const screenshotPublicPath = `/${ORIGINAL}`;", "const screenshotPublicPath = `/${ORIGINAL.replace(/^public\\//, '')}`;")
          s = s.replace('`<a href="/${ORIGINAL}" aria-label="Open the original Gray Swan profile screenshot at full size">', '`<a href="/${ORIGINAL.replace(/^public\\//, \'\')}" aria-label="Open the original Gray Swan profile screenshot at full size">')
          s = s.replace('contentUrl: `https://mariomarcolongo.com${screenshotPublicPath}`', 'contentUrl: "https://mariomarcolongo.com${screenshotPublicPath}"')
          p.write_text(s)
          PY

      - name: Apply current snapshot to source records
        run: node scripts/migrate-gray-swan-2026-07-29.cjs

      - name: Generate responsive high-quality previews
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('public/evidence/gray-swan-arena-mario-marcolongo-2026-07-29-033550-CEST.png')
          output = Path('public/media/work')
          output.mkdir(parents=True, exist_ok=True)

          with Image.open(source) as image:
              image = image.convert('RGB')
              for width in (800, 1600):
                  height = round(image.height * width / image.width)
                  resized = image.resize((width, height), Image.Resampling.LANCZOS)
                  resized.save(output / f'gray-swan-profile-2026-07-29-{width}.webp', 'WEBP', quality=92, method=6)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build and verify website
        run: npm run build

      - name: Verify responsive rendering
        run: npm run verify:render

      - name: Generate current CV PDFs
        run: npm run pdf

      - name: Remove one-time migration machinery
        run: |
          rm scripts/migrate-gray-swan-2026-07-29.cjs
          rm .github/workflows/apply-gray-swan-2026-07-29.yml

      - name: Commit complete release update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update portfolio and CVs with Gray Swan #74 snapshot'
            git push origin HEAD:update/gray-swan-2026-07-29
          fi
