name: Finalize Gray Swan 29 July consistency

on:
  push:
    branches:
      - update/gray-swan-2026-07-29

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correct remaining source and package metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('data/source.js')
          text = source.read_text()
          old = 'The same screenshot shows Arena rank #370, 27 global unique breaks, 1,090 points and 246 submissions.'
          new = 'The same screenshot shows Arena rank #365, 28 global unique breaks, 1,120 points and 255 submissions.'
          if old not in text:
              raise SystemExit('Expected stale Arena summary was not found in data/source.js')
          source.write_text(text.replace(old, new))

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          lock['version'] = '2026.07.29'
          lock['packages']['']['version'] = '2026.07.29'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          checks = Path('scripts/check-stale-strings.js')
          checks_text = checks.read_text()
          marker = "for (const [field, actual, expected] of currentGraySwanChecks) {\n  if (actual !== expected) fail('data/source.js', 1, `${field} must equal ${JSON.stringify(expected)}; found ${JSON.stringify(actual)}.`);\n}\n"
          addition = marker + "\nconst currentAiPillar = (D.pillars || []).find((item) => item?.category === 'AI EVALUATION & SAFETY OPERATIONS');\nfor (const required of ['#74', 'top 6%', '113 platform-recorded total breaks', 'Arena rank #365', '28 global unique breaks', '1,120 points', '255 submissions', '29 July 2026']) {\n  if (!String(currentAiPillar?.desc || '').includes(required)) fail('data/source.js', 1, `Current AI-evaluation pillar is missing: ${required}`);\n}\n\nconst packageLock = JSON.parse(fs.readFileSync(path.join(ROOT, 'package-lock.json'), 'utf8'));\nif (packageLock.version !== packageJson.version || packageLock.packages?.['']?.version !== packageJson.version) {\n  fail('package-lock.json', 1, `Package version must match package.json (${packageJson.version}).`);\n}\n"
          if marker not in checks_text:
              raise SystemExit('Could not locate Gray Swan checks insertion point')
          checks.write_text(checks_text.replace(marker, addition))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build and verify website
        run: npm run build

      - name: Verify responsive rendering
        run: npm run verify:render

      - name: Generate current CV PDFs
        run: npm run pdf

      - name: Remove one-time workflow
        run: rm .github/workflows/finalize-gray-swan-2026-07-29.yml

      - name: Commit final synchronized outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize final Gray Swan snapshot outputs'
          git push origin HEAD:update/gray-swan-2026-07-29
