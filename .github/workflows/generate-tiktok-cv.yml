name: Generate TikTok application CV

on:
  push:
    branches:
      - application/tiktok-safety-model-operations
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CV_PHONE: ${{ secrets.CV_PHONE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site and verify targeted HTML
        run: |
          npm run build
          node scripts/verify-tiktok-cv.js

      - name: Generate specialized PDFs
        run: npm run pdf:resume

      - name: Verify targeted PDF ATS extraction
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdftotext -layout "Mario Marcolongo — TikTok Safety Model Data Operations CV.pdf" audit-output/tiktok-cv-extracted.txt
          node scripts/verify-tiktok-pdf-text.js

      - name: Upload targeted CV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-safety-model-operations-cv
          path: |
            Mario Marcolongo — TikTok Safety Model Data Operations CV.pdf
            dist/cv-tiktok-safety-operations.html
            audit-output/cv-tiktok-safety-operations-print-fit.json
            audit-output/tiktok-cv-extracted.txt
          if-no-files-found: warn
          retention-days: 7
