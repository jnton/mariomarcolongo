name: Force and verify current production deployment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  deployments: write

jobs:
  deploy-current-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and verify release
        run: |
          npm run build
          npm run verify:render

      - name: Deploy current release to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mariomarcolongo-pages --branch=main --commit-hash=${{ github.event.pull_request.head.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the public release
        env:
          LIVE_RELEASE_ID: ${{ github.event.pull_request.head.sha }}
          LIVE_VERIFY_ATTEMPTS: '18'
          LIVE_VERIFY_DELAY_MS: '10000'
        run: npm run verify:live

      - name: Remove one-time deployment workflow
        run: rm .github/workflows/force-current-production-deploy.yml

      - name: Commit permanent live-verification support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add verified live release checks'
          git push origin HEAD:ops/verify-and-force-current-deploy
