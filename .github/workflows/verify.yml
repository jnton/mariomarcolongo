name: Verify portfolio

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and verify generated output
        shell: bash
        run: |
          mkdir -p audit-output
          set -o pipefail
          npm run build 2>&1 | tee audit-output/build.log

      - name: Verify application-specific CVs
        run: |
          node scripts/verify-orcid-cv.js
          node scripts/verify-giskard-cv.js
          node scripts/verify-tiktok-cv.js

      - name: Diagnose mobile layout
        run: node scripts/diagnose-mobile-overflow.js | tee audit-output/mobile-overflow.json

      - name: Regenerate and verify canonical dossiers
        run: |
          npm run generate:llms
          node scripts/verify-dist.js

      - name: Verify rendered pages and interactions
        shell: bash
        run: |
          find audit-output -type f -name '*.png' -delete
          set -o pipefail
          npm run verify:render 2>&1 | tee audit-output/render.log

      - name: Verify Notandia continuity and legacy-link safety
        run: node scripts/verify-notandia-transition.js

      - name: Generate seven specialized application PDFs
        run: npm run pdf:resume

      - name: Verify specialized PDF ATS text extraction
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdftotext -layout "Mario Marcolongo — Giskard AI Safety & Security Researcher CV.pdf" audit-output/giskard-cv-extracted.txt
          node scripts/verify-giskard-pdf-text.js
          pdftotext -layout "Mario Marcolongo — TikTok Safety Model Data Operations CV.pdf" audit-output/tiktok-cv-extracted.txt
          node scripts/verify-tiktok-pdf-text.js

      - name: Generate master CV PDF
        run: npm run pdf:cv

      - name: Check patch formatting
        run: git diff --check

      - name: Upload verification screenshots, logs, full build and PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-output
          path: |
            audit-output/**/*
            dist/**/*
            llms.txt
            llms-full.txt
            cv-llm.txt
            public/llms.txt
            public/llms-full.txt
            public/cv-llm.txt
            public/data/source.js
            index.html
            mdpi-filter.html
            integrity.html
            cv.html
            cv-resume.html
            cv-tiktok-safety-operations.html
            cv-giskard.html
            cv-research.html
            cv-editorial.html
            cv-integrity.html
            cv-orcid.html
            security.html
            Mario Marcolongo — AI Evaluation & Model Behavior CV.pdf
            Mario Marcolongo — TikTok Safety Model Data Operations CV.pdf
            Mario Marcolongo — Giskard AI Safety & Security Researcher CV.pdf
            Mario Marcolongo — Scientific AI Quality & Research Data CV.pdf
            Mario Marcolongo — Research Editorial & Community Operations CV.pdf
            Mario Marcolongo — Trust Safety & Knowledge Integrity CV.pdf
            Mario Marcolongo — ORCID Member Support Technical Specialist CV.pdf
            Mario Marcolongo — Curriculum Vitae.pdf
          if-no-files-found: ignore
          retention-days: 7
