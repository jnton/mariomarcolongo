name: Verify BMJ application CV

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/bmj-positioning.mjs'
      - 'src/pages/cv-bmj.astro'
      - 'scripts/verify-bmj-cv.js'
      - 'scripts/generate-bmj-pdf.js'
      - '.github/workflows/verify-bmj-cv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-bmj-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build portfolio and CV route
        run: npm run build

      - name: Verify BMJ CV content and ATS structure
        run: node scripts/verify-bmj-cv.js

      - name: Generate two-page BMJ application PDF
        run: node scripts/generate-bmj-pdf.js

      - name: Check patch formatting
        run: git diff --check

      - name: Upload BMJ CV, PDF and fit audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bmj-application-cv
          path: |
            dist/cv-bmj.html
            audit-output/cv-bmj-print-fit.json
            Mario Marcolongo — BMJ Publishing Data & Insights CV.pdf
          if-no-files-found: warn
          retention-days: 14
